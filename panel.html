<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { 
      background-color: #121212; 
      color: #00ff00; 
      font-family: 'Courier New', monospace; 
      padding: 10px; 
      margin: 0; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      box-sizing: border-box; 
    }
    h3 { 
      margin-top: 0; 
      border-bottom: 1px solid #333; 
      padding-bottom: 10px; 
    }
    select, button, input[type="number"], input[type="text"] { 
      width: 100%; 
      background: #222; 
      color: #0f0; 
      border: 1px solid #0f0; 
      padding: 10px; 
      margin-bottom: 15px; 
      font-family: monospace; 
      cursor: pointer; 
      box-sizing: border-box; 
    }
    button:hover { 
      background: #0f0; 
      color: #000; 
      font-weight: bold; 
    }
    .log-box { 
      flex-grow: 1; 
      background: #000; 
      border: 1px solid #333; 
      padding: 10px; 
      overflow-y: auto; 
      color: #888; 
      font-size: 12px; 
      white-space: pre-wrap; 
    }
    .config-label { 
      font-size: 12px; 
      color: #aaa; 
      margin-bottom: 5px; 
      display: block; 
    }
  </style>
</head>
<body>
  <h3>🗡️ GBF Auto Framework</h3>
  
  <span class="config-label">Select Routine:</span>
  <select id="routineSelect">
    <option value="slime">🗡️ Slime Farmer Routine</option>
    <option value="eventRun">⚔️ Event Auto-Run</option>
    <option value="buff">🎁 Daily Buff Checker</option>
    <option value="dailyRaid">⏩ Daily Raid Skip</option>
    <option value="raidSearch">🔍 Auto Raid Search</option> 
  </select>

  <div id="slimeConfigContainer" style="display: block;">
    <span class="config-label">Target Quest ID (e.g., 400181/4):</span>
    <input type="text" id="slimeIdInput" value="400181/4">
  </div>

  <div id="eventConfigContainer" style="display: none;">
    <span class="config-label">Target Event ID (e.g., 944131/3):</span>
    <input type="text" id="eventIdInput" value="944131/3">
  </div>

  <div id="summonConfigContainer" style="display: block;">
    <span class="config-label">Target Summon:</span>
    <select id="summonIdInput">
      <option value="2040114000">Kaguya</option>
      <option value="2040003000">Bahamut</option>
      <option value="2040056000">Lucifer</option>
      <option value="2040094000">Agni</option>
      <option value="2040100000">Varuna</option>
      <option value="2040084000">Titan</option>
      <option value="2040020000">Zephyrus</option>
      <option value="2040080000">Zeus</option>
      <option value="2040090000">Hades</option>
      <option value="2040094000">Colossus</option>
      <option value="2040028000">Leviathan</option>
      <option value="2040027000">Yggdrasil</option>
      <option value="2040020000">Tiamat</option>
      <option value="2040047000">Luminiera</option>
      <option value="2040046000">Celeste</option>
    </select>
    
    <span class="config-label">Target Summon Rank (0-4):</span>
    <input type="number" id="summonRankInput" value="4" min="0" max="4">
  </div>

  <div id="slotConfigContainer" style="display: none;">
    <span class="config-label">Target Search Slot:</span>
    <select id="slotSelect">
      <option value="1">Slot 1</option>
      <option value="2">Slot 2</option>
      <option value="3">Slot 3</option>
      <option value="4">Slot 4</option>
    </select>

    <span class="config-label">Auto-Attack Wait Time (Seconds):</span>
    <input type="number" id="waitTimeInput" value="15" min="1" max="180">
  </div>

  <button id="startBtn">Start Engine</button>
  
  <div class="log-box" id="statusLog">>> Framework IDLE...</div>

  <script src="panel.js"></script>
</body>
</html>
